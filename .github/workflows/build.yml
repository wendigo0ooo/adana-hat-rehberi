name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and test
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode release keystore
        working-directory: .
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            ls -l "$RUNNER_TEMP/release.jks"
          else
            echo "Keystore secret yok; release APK imzasiz kalacak. Debug APK kullanilabilir."
          fi

      - name: Build APKs
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        working-directory: .
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/AdanaHatRehberi-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk out/AdanaHatRehberi-release.apk
          else
            echo "Imzali release APK uretilmedi (keystore secret'lari eksik)."
          fi
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh out

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AdanaHatRehberi-build${{ github.run_number }}
          path: |
            out/*.apk
            out/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build${{ github.run_number }}
          name: Adana Hat Rehberi (build ${{ github.run_number }})
          body: |
            Adana belediye otobüsü, dolmuş/minibüs ve M1 metro güzergah rehberi.
            Sürüm: 1.0.${{ github.run_number }} (versionCode ${{ github.run_number }})
            Debug sürümü imzalıdır ve doğrudan kurulabilir.
            Commit: ${{ github.sha }}
          files: |
            out/*.apk
            out/SHA256SUMS.txt
          fail_on_unmatched_files: false
